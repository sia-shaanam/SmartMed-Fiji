<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Health Records</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Ionicons for icons -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="container">
        <h1>Electronic Health Records</h1>
        <div class="ehr-card">
            <h2>Patient Information</h2>
            <div class="patient-info">
                <p><strong>Name:</strong> John Doe</p>
                <p><strong>Age:</strong> 35</p>
                <p><strong>Gender:</strong> Male</p>
                <p><strong>Blood Type:</strong> O+</p>
            </div>
        </div>

        <div class="ehr-section">
            <h2>Medical History</h2>
            <textarea placeholder="Enter medical history details..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Consultations</h2>
            <textarea placeholder="Record consultation details..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Medications</h2>
            <textarea placeholder="List prescribed medications..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Surgeries</h2>
            <textarea placeholder="Record any surgeries..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Allergies</h2>
            <textarea placeholder="List known allergies..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Lab Results</h2>
            <input type="file" id="lab-results" name="lab-results" accept="image/*, .pdf">
        </div>

        <div class="ehr-section">
            <h2>Prescriptions</h2>
            <textarea placeholder="Record prescriptions..." rows="5"></textarea>
        </div>

        <div class="ehr-section">
            <h2>Treatment History</h2>
            <textarea placeholder="Chronological treatment history..." rows="5"></textarea>
        </div>

        <button type="submit" class="save-btn">Save Records</button>
    </div>
</body>
</html>
