<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
  /* General Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial', sans-serif;
  background-color: #f5f5f7;
}

.container {
  display: flex;
}

/* Sidebar Styling */
.sidebar {
  width: 250px;
  background-color: #ffffff;
  padding: 20px;
  border-right: 1px solid #e0e0e0;
}

.sidebar .logo {
  text-align: center;
  margin-bottom: 20px;
}

.sidebar nav ul {
  list-style: none;
}

.sidebar nav ul li {
  margin: 20px 0;
}

.sidebar nav ul li a {
  text-decoration: none;
  color: #333;
  display: block;
  padding: 10px 20px;
  border-radius: 10px;
  transition: background-color 0.3s;
}

.sidebar nav ul li a:hover, 
.sidebar nav ul li.active a {
  background-color: #dce8ff;
  color: #5b87fa;
}

.logout {
  margin-top: 30px;
  text-align: center;
}

.logout a {
  text-decoration: none;
  color: #f44336;
}


</style>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="Puzzler Logo">
            </div>
            <nav>
                <ul>
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Order</a></li>
                    <li class="active"><a href="#">Product</a></li>
                    <li><a href="#">Customer</a></li>
                    <li><a href="#">Employee</a></li>
                    <li><a href="#">Billing</a></li>
                    <li><a href="#">Analytics</a></li>
                    <li><a href="#">Settings</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>
            <div class="logout">
                <a href="#">Log out</a>
            </div>
        </aside>

        <!-- Main Content -->
        
    </div>
</body>
</html>
