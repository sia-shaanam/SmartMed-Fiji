<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, rgba(0, 204, 255, 0.5), rgba(0, 51, 255, 0.5)), url('background.jpg');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-align: center;
        }
        
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        label {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 500;
            color: #ffffff;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        
        #role {
            color: black;
        }

        input[type="submit"] {
            background-color: #00ccff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        input[type="submit"]:hover {
            background-color: #0066ff;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .glass-card {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h2>Register</h2>
            <form action="register.php" method="POST">
                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Admin</option>
                    <option value="nurse">Nurse</option> <!-- Added Nurse Option -->
                </select>

                <label for="user_id">User ID:</label>
                <input type="text" id="user_id" name="user_id" placeholder="Enter User ID" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter Full Name" required>

                <label for="contact_information">Contact Information:</label>
                <input type="text" id="contact_information" name="contact_information" placeholder="Enter Contact Information" required>

                <input type="submit" value="Register">
            </form>
        </div>
    </div>
</body>
</html>
