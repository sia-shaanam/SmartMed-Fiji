<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Tracker - Login</title>
    <style>
        * {
            font-family: 'Arial', sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f0f4f8, #00aaff);
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            overflow: hidden;
            background-color: #fff;
        }

        .login_img {
            flex: 1;
            background-image: url(../img/login2.webp);
            background-size: cover;
            background-position: center;
        }

        .user_card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            background-color: #f9fafc;
        }

        .user_card img {
            width: 120px;
            margin-bottom: 20px;
            align-self: center;
        }

        .nav {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .nav ul {
            display: flex;
            list-style: none;
        }

        .nav ul li {
            margin: 0 15px;
        }

        .nav ul li a {
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            color: #00aaff;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }

        .nav ul li a:hover, .nav ul li a.active {
            background-color: #00aaff;
            color: #fff;
        }

        .form-container {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .login_form, .staff_form {
            opacity: 0;
            position: absolute;
            transform: translateX(-100%);
            display: none;
        }

        .login_form.active, .staff_form.active {
            opacity: 1;
            transform: translateX(0);
            display: block;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #000203;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #00aaff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #005fa3;
        }

        .signup-note {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            margin-right: 150px;
        }
        .signup-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #00aaff;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .signup-btn:hover {
            background-color: #00aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login_img"></div>
        <div class="user_card">
           
            <div class="nav">
                <ul>
                    <li><a href="#" id="loginBtn" class="active">Patient Login</a></li>
                    <li><a href="#" id="staffLoginBtn">Staff Login</a></li>
                </ul>
            </div>
            <div class="form-container">
                <div class="form-box login_form active" id="loginForm">
                    <form action="../patient/login.php" method="POST"> 
                        <fieldset>
                            <legend>Welcome Back, Patient!</legend>
                            <label for="login_id">Username: </label>
                            <input type="text" id="login_id" name="login_id" required>
                            <label for="password">Password: </label>
                            <input type="password" id="password" name="password" required>
                            <input type="submit" value="Login">
                        </fieldset>
                    </form>
                </div>

                <div class="form-box staff_form" id="staffForm">
                    <form action="login.php" method="POST" >
                        <fieldset>
                            <legend>Welcome Back, Staff!</legend>
                            <label for="user_id">Username: </label>
                            <input type="text" id="user_id" name="user_id" required>
                            <label for="password">Password: </label>
                            <input type="password" id="password" name="password" required>
                            <input type="submit" value="Login">
                        </fieldset>
                    </form>
                </div>
            </div>
            <div class="signup-note">
                If you don't have an account, <a href="pRegister.php" class="signup-btn">Sign Up here</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle between login and staff login forms
        document.getElementById('loginBtn').addEventListener('click', function() {
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('staffForm').classList.remove('active');
            document.querySelector('.nav ul li a.active').classList.remove('active');
            this.classList.add('active');
        });

        document.getElementById('staffLoginBtn').addEventListener('click', function() {
            document.getElementById('staffForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
            document.querySelector('.nav ul li a.active').classList.remove('active');
            this.classList.add('active');
        });
    </script>
</body>
</html>
