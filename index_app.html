<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Appointment - Smart Med Fiji</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Background with Dynamic Medical Theme */
body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, rgba(0, 191, 255, 0.2), rgba(255, 255, 255, 0.1)),
                url('https://wallpaperaccess.com/full/3275630.jpg') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glassmorphism Container */
.container {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    padding: 30px;
    max-width: 500px;
    width: 100%;
    color: #140d0d;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

/* Form Styling */
.appointment-form {
    display: flex;
    flex-direction: column;
}

.input-group {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
    color: #fff;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: none;
    background: rgba(255, 255, 255, 0.7);
    color: #333;
    font-size: 1rem;
}

button {
    padding: 15px;
    background-color: rgba(0, 191, 255, 0.8);
    border: none;
    color: white;
    font-size: 1.2rem;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

button:hover {
    background-color: rgba(0, 191, 255, 1);
}

/* Medical Icon Dynamic Background (optional animation) */
@keyframes heartbeat {
    0% { background-color: rgba(255, 0, 0, 0.1); }
    50% { background-color: rgba(255, 0, 0, 0.3); }
    100% { background-color: rgba(255, 0, 0, 0.1); }
}

body::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    z-index: -1;
    background: url('heartbeat_animation.gif') no-repeat center;
    opacity: 0.2;
    animation: heartbeat 2s infinite;
}

</style>
<body>
    <div class="container">
        <h1>Book Your Appointment</h1>
        <form class="appointment-form">
            <div class="input-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="input-group">
                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="input-group">
                <label for="time">Preferred Time:</label>
                <input type="time" id="time" name="time" required>
            </div>
            <div class="input-group">
                <label for="doctor">Select Doctor:</label>
                <select id="doctor" name="doctor">
                    <option value="dr-smith">Dr. Smith</option>
                    <option value="dr-jones">Dr. Jones</option>
                    <option value="dr-brown">Dr. Brown</option>
                </select>
            </div>
            <button type="submit">Book Appointment</button>
        </form>
    </div>
</body>
</html>
